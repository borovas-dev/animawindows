name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 is GA; this keeps working if a newer preview band is ever pinned in global.json.
          dotnet-quality: ga
      - name: Test Core
        run: dotnet test --project tests/AnimaWindows.Core.Tests -c Release -- --filter-not-trait "Category=Live"
      - name: Test Providers
        run: dotnet test --project tests/AnimaWindows.Providers.Tests -c Release -- --filter-not-trait "Category=Live"
      - name: Test Data
        run: dotnet test --project tests/AnimaWindows.Data.Tests -c Release -- --filter-not-trait "Category=Live"

  app:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: ga

      - name: Fetch libmpv (LGPL build, zhongfly/mpv-winbuild)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arch = if ('${{ matrix.platform }}' -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $rid  = if ('${{ matrix.platform }}' -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          $rel  = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-lgpl-$arch-2*.7z" } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-lgpl-$arch asset in $($rel.tag_name)" }
          Write-Host "Using $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in archive" }
          $dest = "AnimaWindows.App/native/$rid"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $dll.FullName $dest

      - name: Restore
        run: dotnet restore AnimaWindows.App/AnimaWindows.App.csproj -p:Platform=${{ matrix.platform }}
      - name: Create signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $pfx = Join-Path $dir 'animawindows.pfx'
          if ($env:PFX_BASE64) {
            # Persistent certificate from repository secrets: trust it once, every build installs.
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $pw = $env:PFX_PASSWORD
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $pw)
          } else {
            # Fallback: throwaway certificate for this build only (subject must equal the manifest Publisher).
            $pw = [guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=animawindows' -KeyUsage DigitalSignature `
              -FriendlyName 'animawindows CI' -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -NotAfter (Get-Date).AddYears(1)
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          }
          $cer = Join-Path $dir 'animawindows-signing.cer'
          [IO.File]::WriteAllBytes($cer, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Write-Host "Signing with $($cert.Subject) thumbprint $($cert.Thumbprint)"
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "cer=$cer" >> $env:GITHUB_OUTPUT
          "::add-mask::$pw"
          "password=$pw" >> $env:GITHUB_OUTPUT
      - name: Build signed MSIX
        run: >
          dotnet build AnimaWindows.App/AnimaWindows.App.csproj -c Release --no-restore
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile="${{ steps.cert.outputs.pfx }}"
          -p:PackageCertificatePassword="${{ steps.cert.outputs.password }}"
      - name: Add certificate to artifact
        shell: pwsh
        run: Get-ChildItem AnimaWindows.App -Recurse -Directory -Filter AppPackages | ForEach-Object { Copy-Item '${{ steps.cert.outputs.cer }}' $_.FullName }
      - uses: actions/upload-artifact@v7
        with:
          name: animawindows-msix-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            AnimaWindows.App/AppPackages/**
            AnimaWindows.App/bin/${{ matrix.platform }}/Release/**/AppPackages/**
