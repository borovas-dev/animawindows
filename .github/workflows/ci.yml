name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 is GA; this keeps working if a newer preview band is ever pinned in global.json.
          dotnet-quality: ga
      - name: Test Core
        run: dotnet test --project tests/AnimaWindows.Core.Tests -c Release -- --filter-not-trait "Category=Live"
      - name: Test Providers
        run: dotnet test --project tests/AnimaWindows.Providers.Tests -c Release -- --filter-not-trait "Category=Live"
      - name: Test Data
        run: dotnet test --project tests/AnimaWindows.Data.Tests -c Release -- --filter-not-trait "Category=Live"

  app:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: ga

      - name: Fetch libmpv (LGPL build, zhongfly/mpv-winbuild)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arch = if ('${{ matrix.platform }}' -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $rid  = if ('${{ matrix.platform }}' -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          $rel  = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-lgpl-$arch-2*.7z" } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-lgpl-$arch asset in $($rel.tag_name)" }
          Write-Host "Using $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in archive" }
          $dest = "AnimaWindows.App/native/$rid"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $dll.FullName $dest

      - name: Restore
        run: dotnet restore AnimaWindows.App/AnimaWindows.App.csproj -p:Platform=${{ matrix.platform }} -p:WindowsAppSDKSelfContained=true
      - name: Build MSIX
        run: >
          dotnet build AnimaWindows.App/AnimaWindows.App.csproj -c Release --no-restore
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:WindowsAppSDKSelfContained=true
      - name: Sign MSIX
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $X509 = [System.Security.Cryptography.X509Certificates.X509Certificate2]
          $Flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $pw = [guid]::NewGuid().ToString('N')
          if ($env:PFX_BASE64) {
            # Persistent certificate from repository secrets (trust it once; every build installs).
            # Re-export through Windows crypto: SignTool cannot read OpenSSL 3+/4 PBES2 PFX files.
            $src = $X509::new([Convert]::FromBase64String($env:PFX_BASE64), $env:PFX_PASSWORD, $Flags::Exportable -bor $Flags::EphemeralKeySet)
            $bytes = $src.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $pw)
          } else {
            # Fallback (e.g. fork PRs): throwaway certificate for this build only.
            $tmp = New-SelfSignedCertificate -Type Custom -Subject 'CN=animawindows' -KeyUsage DigitalSignature `
              -FriendlyName 'animawindows CI' -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -NotAfter (Get-Date).AddYears(1)
            $bytes = $tmp.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $pw)
          }
          $pfx = Join-Path $dir 'animawindows.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $cert = $X509::new($pfx, $pw)
          Write-Host "Signing with $($cert.Subject) thumbprint $($cert.Thumbprint)"
          $cer = Join-Path $dir 'animawindows-signing.cer'
          [IO.File]::WriteAllBytes($cer, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Write-Host "Using $($signtool.FullName)"

          $packages = Get-ChildItem AnimaWindows.App -Recurse -Include *.msix, *.msixbundle | Where-Object { $_.FullName -match 'AppPackages' }
          if (-not $packages) { throw 'No MSIX packages found' }
          # Remove certificates the packaging step drops next to the package; ours replaces them.
          $packages | ForEach-Object { Get-ChildItem $_.DirectoryName -Filter *.cer | Remove-Item -Force }
          foreach ($p in $packages) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $pw $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($p.Name)" }
            $sig = Get-AuthenticodeSignature $p.FullName
            if ($sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "$($p.Name) is not signed with the expected certificate (status: $($sig.Status))" }
            Write-Host "Signed $($p.Name)"
            Copy-Item $cer $p.DirectoryName
          }
      - uses: actions/upload-artifact@v7
        with:
          name: animawindows-msix-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            AnimaWindows.App/AppPackages/**
            AnimaWindows.App/bin/${{ matrix.platform }}/Release/**/AppPackages/**

  store:
    # Partner Center upload package: Store identity, unsigned (the Store signs it).
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: ga

      - name: Fetch libmpv (LGPL build, zhongfly/mpv-winbuild)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arch = if ('${{ matrix.platform }}' -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $rid  = if ('${{ matrix.platform }}' -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          $rel  = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-lgpl-$arch-2*.7z" } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-lgpl-$arch asset in $($rel.tag_name)" }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in archive" }
          $dest = "AnimaWindows.App/native/$rid"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $dll.FullName $dest

      - name: Apply Store identity
        shell: pwsh
        run: |
          $path = 'AnimaWindows.App/Package.appxmanifest'
          [xml]$m = Get-Content $path -Raw
          $m.Package.Identity.Name = 'borovas-dev.animawindows'
          $m.Package.Identity.Publisher = 'CN=F1DA27C4-A9D4-4721-AC60-FE545585BDF8'
          $m.Package.Properties.PublisherDisplayName = 'borovas-dev'
          $m.Save((Resolve-Path $path))

      - name: Restore
        run: dotnet restore AnimaWindows.App/AnimaWindows.App.csproj -p:Platform=${{ matrix.platform }} -p:WindowsAppSDKSelfContained=true
      - name: Build Store upload
        run: >
          dotnet build AnimaWindows.App/AnimaWindows.App.csproj -c Release --no-restore
          -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxPackageSigningEnabled=false
          -p:AppxSymbolPackageEnabled=false
          -p:WindowsAppSDKSelfContained=true
          -p:AppxBundle=Never
      - name: Check no experimental framework dependency
        shell: pwsh
        run: |
          $u = Get-ChildItem AnimaWindows.App -Recurse -Filter *.msixupload | Select-Object -First 1
          Expand-Archive $u.FullName up -Force
          Get-ChildItem up -Filter *.msixbundle | ForEach-Object { Expand-Archive ($_.FullName) -DestinationPath b -Force } 2>$null
          Get-ChildItem up,b -Recurse -Filter *.msix | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName p.zip; Expand-Archive p.zip pk -Force }
          $deps = Select-String -Path pk/AppxManifest.xml -Pattern 'PackageDependency.*'
          $deps | ForEach-Object { Write-Host $_.Line.Trim() }
          if ($deps -match 'WindowsAppRuntime') { throw 'Store package still depends on the Windows App Runtime framework' }
      - uses: actions/upload-artifact@v7
        with:
          name: animawindows-store-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            AnimaWindows.App/AppPackages/**/*.msixupload
            AnimaWindows.App/bin/${{ matrix.platform }}/Release/**/AppPackages/**/*.msixupload
